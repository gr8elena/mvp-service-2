version: '3.8'

services:
  user_profile:
    image: postgres:16-alpine
    container_name: user_profile_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: user_profile
      POSTGRES_USER: user_profile_user
      POSTGRES_PASSWORD: user_profile_user_pass
    ports:
      - "5435:5432"
    volumes:
      - user_profile_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user_profile_user -d user_profile"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  user_profile_data: