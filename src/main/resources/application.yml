server:
  port: 8081

spring:
  datasource:
    url: jdbc:postgresql://localhost:5435/user_profile
    username: user_profile_user
    password: user_profile_user_pass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true   # useful when DB already exists
    validate-on-migrate: true

logging:
  level:
    feign: DEBUG
    com.example: DEBUG
    org.springframework.cloud.openfeign: DEBUG
